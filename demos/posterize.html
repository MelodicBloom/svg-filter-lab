<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Ink Print — SVG Filter Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background-color: #f43f5e; background-image: linear-gradient(45deg,#0f172a 25%,transparent 25%),linear-gradient(-45deg,#0f172a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0f172a 75%),linear-gradient(-45deg,transparent 75%,#0f172a 75%); background-size: 40px 40px; background-position: 0 0,0 20px,20px -20px,-20px 0px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Impact', 'Arial Black', sans-serif; padding: 40px 24px; }
    nav { position: fixed; top: 20px; left: 24px; }
    nav a { color: #fef3c7; text-decoration: none; font-size: 0.85rem; font-weight: 700; }
    .ink-card { width: 450px; padding: 36px; background: #fef3c7; border: 5px solid #0f172a; box-shadow: 16px 16px 0px 0px #0f172a; border-radius: 4px; color: #0f172a; transform: translateZ(0); transition: transform 0.1s ease-out, box-shadow 0.1s ease-out; }
    .ink-card:hover { transform: translate(-4px,-4px); box-shadow: 20px 20px 0px 0px #0f172a; }
    .graphic { width: 100%; height: 120px; background: linear-gradient(90deg,#3b82f6 0%,#10b981 50%,#f59e0b 100%); margin-bottom: 24px; border: 3px solid #0f172a; }
    h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; margin-bottom: 14px; }
    p { font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; font-weight: bold; line-height: 1.5; color: #1e293b; }
  </style>
</head>
<body>

  <nav><a href="../index.html">← Filter Lab</a></nav>

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="vintage-ink-quantizer" x="0%" y="0%" width="100%" height="100%">
        <feComponentTransfer in="SourceGraphic" result="posterizedColors">
          <feFuncR type="discrete" tableValues="0.0 0.33 0.66 1.0" />
          <feFuncG type="discrete" tableValues="0.0 0.33 0.66 1.0" />
          <feFuncB type="discrete" tableValues="0.0 0.5 1.0" />
        </feComponentTransfer>
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="rawNoise" />
        <feColorMatrix type="saturate" values="0" in="rawNoise" result="desaturatedGrain" />
        <feComponentTransfer in="desaturatedGrain" result="boundedGrain">
          <feFuncA type="linear" slope="0.09" />
        </feComponentTransfer>
        <feBlend mode="multiply" in="posterizedColors" in2="boundedGrain" />
      </filter>
    </defs>
  </svg>

  <div class="ink-card filter-posterize">
    <div class="graphic"></div>
    <h1>Ink Print</h1>
    <p>Color-quantized posterization via discrete feComponentTransfer. Red and green split into 4 tonal steps. Blue forced into 3 — simulating the limited ink registration of vintage risograph and screen printing.</p>
  </div>

</body>
</html>
