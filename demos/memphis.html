<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memphis + Risograph — SVG Filter Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background-color: #fef08a; background-image: radial-gradient(#0f172a 15%, transparent 16%), radial-gradient(#0f172a 15%, transparent 16%); background-size: 30px 30px; background-position: 0 0, 15px 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Courier New', Courier, monospace; padding: 40px 24px; }
    nav { position: fixed; top: 20px; left: 24px; }
    nav a { color: #0f172a; text-decoration: none; font-size: 0.85rem; font-weight: 700; }
    .memphis-card { position: relative; width: 440px; padding: 32px; background: rgba(254,243,199,0.5); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 4px solid #0f172a; box-shadow: 12px 12px 0px 0px #0f172a; border-radius: 4px; color: #0f172a; transform: translateZ(0); transition: transform 0.15s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.15s ease; }
    .memphis-card:hover { transform: translate(-4px,-4px); box-shadow: 16px 16px 0px 0px #0f172a; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0f172a; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
    .dot { width: 16px; height: 16px; background: #ef4444; border: 2px solid #0f172a; border-radius: 50%; }
    p { font-size: 0.95rem; line-height: 1.5; font-weight: 700; margin-bottom: 24px; }
    button { padding: 8px 16px; font-size: 0.85rem; font-weight: 900; text-transform: uppercase; font-family: inherit; background: #38bdf8; border: 2px solid #0f172a; box-shadow: 4px 4px 0px 0px #0f172a; border-radius: 2px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
    button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0px 0px #0f172a; }
  </style>
</head>
<body>

  <nav><a href="../index.html">← Filter Lab</a></nav>

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="riso-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="rawNoise" />
        <feColorMatrix type="saturate" values="0" in="rawNoise" result="desaturatedGrain" />
        <feComponentTransfer in="desaturatedGrain" result="attenuatedGrain">
          <feFuncA type="linear" slope="0.07" />
        </feComponentTransfer>
        <feBlend mode="multiply" in="SourceGraphic" in2="attenuatedGrain" />
      </filter>
    </defs>
  </svg>

  <div class="memphis-card filter-riso">
    <div class="header">
      <h1>PANEL_01</h1>
      <div class="dot"></div>
    </div>
    <p>High-frequency analog grain layered over a glassmorphic Memphis container via feComponentTransfer opacity attenuation at 7%. Block shadows and 4px borders give hard graphic structure.</p>
    <button onclick="this.textContent='Executed.'" >Execute</button>
  </div>

</body>
</html>
