name: Seed Loom Truchet specimen
on:
  pull_request:
    paths: ['examples/truchet-seed35*', 'demos/truchet-seed35.html', 'index.html', 'tests/truchet-specimen.test.mjs', '.github/workflows/truchet-specimen.yml']
  push:
    branches: ['feat/seed-loom-truchet-specimen-v0']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/truchet-specimen.test.mjs
